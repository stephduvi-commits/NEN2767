<title>NEN 2767 AMAYFA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f0f13;--surface:#16161f;--border:#1e1e2a;--border2:#2a2a3a;
  --text:#e8e6f0;--muted:#6b6b85;--accent:#f49634;
  --green:#22c55e;--red:#ef4444;--orange:#f97316;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);}
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden;}
.screen.active{display:flex;}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.header-back{color:var(--muted);font-size:22px;cursor:pointer;padding:4px;min-width:32px;}
.header-title{font-size:16px;font-weight:700;flex:1;}
.header-sub{font-size:11px;color:var(--muted);}
.header-logo{height:28px;width:auto;}
.header-right{color:var(--muted);font-size:13px;}

/* CONTENT */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}
.content-padded{padding:16px;}

/* SEARCH */
.search-wrap{padding:12px;background:var(--surface);border-bottom:1px solid var(--border);}
.search-input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;outline:none;}
.search-input::placeholder{color:var(--muted);}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;active:background:#1a1a28;transition:background 0.1s;}
.card:active{background:#1a1a28;}
.card-content{flex:1;min-width:0;}
.card-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.card-meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.chevron{color:var(--border2);font-size:18px;}

/* NEN DOT */
.nen-dot{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;flex-shrink:0;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap;}
.ok-badge{background:#1a2e1a;color:var(--green);}
.nok-badge{background:#2e1a1a;color:var(--red);}
.flag-action{background:#1a2e1a;color:var(--green);}
.flag-noaction{background:var(--border);color:var(--muted);}

/* INFO CARD */
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
.info-card-title{padding:10px 14px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;background:var(--bg);border-bottom:1px solid var(--border);}
.info-row{display:flex;padding:10px 14px;border-bottom:1px solid var(--border);gap:12px;}
.info-row:last-child{border-bottom:none;}
.info-label{font-size:12px;color:var(--muted);width:110px;flex-shrink:0;}
.info-value{font-size:13px;flex:1;}

/* STATS ROW */
.stats-row{display:flex;gap:10px;margin-bottom:12px;}
.stat-card{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.stat-value{font-size:22px;font-weight:700;}
.stat-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

/* SECTION TITLE */
.section-title{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.count{background:var(--border2);color:var(--muted);padding:2px 8px;border-radius:20px;font-size:11px;}

/* FORMULAIRE */
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;}
.form-input{width:100%;padding:12px 14px;background:var(--surface);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;outline:none;transition:border-color 0.2s;}
.form-input:focus{border-color:var(--accent);}
.form-input[disabled]{opacity:0.5;}
textarea.form-input{resize:none;min-height:80px;}
select.form-input option{background:var(--surface);}

/* BOUTONS */
.btn{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all 0.2s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:active{background:#d4801e;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border2);margin-top:8px;}
.btn-sm{width:auto;padding:8px 14px;font-size:13px;}
.btn-photo{background:#1a1e2e;color:#6366f1;border:1px dashed #6366f1;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:500;width:100%;margin-bottom:14px;}
.btn-photo:active{background:#1e2238;}

/* PHOTO */
.photo-preview{width:100%;border-radius:10px;margin-bottom:8px;max-height:200px;object-fit:cover;display:none;}
.photo-actions{display:flex;gap:8px;margin-bottom:14px;}
.btn-retake{background:#2e1a1a;color:var(--red);border:1px solid #4a2a2a;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}

/* ACTION CARD */
.action-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.action-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.action-title{font-size:13px;font-weight:600;flex:1;}
.action-date{font-size:11px;color:var(--muted);margin-top:2px;}
.action-photo{width:100%;border-radius:8px;margin-top:8px;max-height:150px;object-fit:cover;cursor:pointer;}
.action-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}

/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-title{font-size:22px;font-weight:800;color:var(--accent);margin-top:12px;}
.login-sub{font-size:13px;color:var(--muted);margin-top:4px;}
.login-error{background:#2e1a1a;border:1px solid #4a2a2a;border-radius:8px;padding:10px 14px;color:var(--red);font-size:13px;margin-bottom:14px;display:none;}

/* FAB */
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 16px rgba(244,150,52,0.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.fab:active{background:#d4801e;transform:scale(0.95);}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:12px;color:var(--muted);}
.spinner{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* MSG */
.success-msg{padding:12px;background:#1a2e1a;border:1px solid #2a4a2a;border-radius:8px;color:var(--green);font-size:13px;margin-bottom:12px;display:none;}
.error-msg{padding:12px;background:#2e1a1a;border:1px solid #4a2a2a;border-radius:8px;color:var(--red);font-size:13px;margin-bottom:12px;display:none;}

/* IMAGE LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;align-items:center;justify-content:center;}
.lightbox.open{display:flex;}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:8px;object-fit:contain;}
.lightbox-close{position:fixed;top:16px;right:16px;color:#fff;font-size:28px;cursor:pointer;z-index:201;}

/* FILTER BAR */
.filter-bar{display:flex;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.filter-btn{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);white-space:nowrap;font-family:'Inter',sans-serif;}
.filter-btn.active{background:#2a1e0e;color:var(--accent);border-color:var(--accent);}

::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
</style>
</head>

<!-- SCREEN: EDIT ACTION -->
<div class="screen" id="screen-edit-action">
  <div class="header">
    <span class="header-back" onclick="goTo('actions')">‹</span>
    <div style="flex:1">
      <div class="header-title">Modifier l'action</div>
      <div class="header-sub" id="edit-action-id"></div>
    </div>
  </div>
  <div class="content content-padded">
    <div id="edit-success" class="success-msg"></div>
    <div id="edit-error" class="error-msg"></div>

    <div class="form-group">
      <label>Référence observation</label>
      <input type="text" id="edit-ref" class="form-input" disabled>

      <textarea id="edit-desc" class="form-input" rows="3"></textarea>
    </div>

      <label>Work Order (WO)</label>
      <input type="text" id="edit-wo" class="form-input">

      <input type="number" id="edit-qty" class="form-input">

      <label>Unité</label>
      <input type="text" id="edit-unit" class="form-input">
    </div>

    <div style="height:40px"></div>
  </div>
</div>

// ===== HELPERS =====
function nenBg(n) {
  const m={1:'#70ad47',2:'#92d050',3:'#ffff00',4:'#ffc000',5:'#ff0000',6:'#c00000'};
  return m[Math.round(parseFloat(n))]||'#2a2a3a';
}
function nenFg(n) { return [1,2,3].includes(Math.round(parseFloat(n)))?'#1a1a1a':'#fff'; }
function nenLabel(n) {
  const m={1:'Excellent',2:'Bon',3:'Acceptable',4:'Médiocre',5:'Mauvais',6:'Critique'};
  return m[parseInt(n)]||'—';
}
function getObs(batId) { return DB.observations.filter(o=>o['ID_Batiment']===batId); }
function getActions(obsId) { return DB.actions.filter(a=>a['ID_Observation']===obsId); }
function calcEtatProjete(obs) {
  const acts = getActions(obs['ID_Observation']);
  const ea = parseFloat(obs['État'])||0;
  const qt = parseFloat(obs['Quantité'])||1;
  const valid = acts.filter(a=>parseFloat(a['Quantite_realisee'])>0&&parseFloat(a['Etat_estime'])>0);
  if (!valid.length) return ea;
  let sum=0, used=0;
  for (const a of valid) {
    const q=Math.min(parseFloat(a['Quantite_realisee']),qt-used);
    if(q<=0) break;
    sum+=(q/qt)*parseFloat(a['Etat_estime']); used+=q;
  }
  sum+=((Math.max(qt-used,0))/qt)*ea;
  return Math.round(sum*10)/10;
}
function formatDate(input) {
  let v=input.value.replace(/\D/g,'');
  if(v.length>=3&&v.length<=4) v=v.slice(0,2)+'-'+v.slice(2);
  else if(v.length>=5) v=v.slice(0,2)+'-'+v.slice(2,4)+'-'+v.slice(4,8);
  input.value=v;
}

// ===== PHOTO =====
function takePhoto() { document.getElementById('photo-input').click(); }
function retakePhoto() { document.getElementById('photo-input').click(); }

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      // Compression WebP
      const canvas = document.createElement('canvas');
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        photoBlob = blob;
        const sizeKB = Math.round(blob.size / 1024);
        const preview = document.getElementById('photo-preview');
        preview.src = URL.createObjectURL(blob);
        preview.style.display = 'block';
        document.getElementById('photo-actions-row').style.display = 'flex';
        document.getElementById('photo-size-info').textContent = `WebP · ${sizeKB} KB (${w}×${h})`;
        document.getElementById('btn-take-photo').style.display = 'none';
      }, 'image/webp', 0.75);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveAction() {
  const success = document.getElementById('add-success');
  const error = document.getElementById('add-error');
  success.style.display='none'; error.style.display='none';

  const nextId = 'ACT-' + String(DB.actions.length + 1).padStart(4, '0');
  let photoUrl = null;

  // Upload photo si présente
  if (photoBlob) {
    success.style.display='block'; success.textContent='⏳ Upload de la photo…';
    const filename = `${selectedObs['ID_Observation']}_${Date.now()}.webp`;
    photoUrl = await uploadPhoto(photoBlob, filename);
    if (!photoUrl) {
      error.style.display='block'; error.textContent='⚠️ Erreur upload photo — action sauvegardée sans photo.';
    }
  }

  const action = {
    id_action: nextId,
    id_observation: selectedObs['ID_Observation'],
    num_action: DB.actions.filter(a=>a['ID_Observation']===selectedObs['ID_Observation']).length + 1,
    description: document.getElementById('add-desc').value || null,
    quantite_realisee: parseFloat(document.getElementById('add-qty').value) || null,
    unite: document.getElementById('add-unit').value || null,
    etat_estime: parseInt(document.getElementById('add-etat').value) || null,
    date_action: document.getElementById('add-date').value || null,
    ok_nok: document.getElementById('add-oknok').value || null,
    wo: document.getElementById('add-wo').value || null,
    remarques: document.getElementById('add-rem').value || null,
    encoded_par: currentUser ? (currentUser.nom || currentUser.username) : null,
    photo_url: photoUrl
  };

  success.style.display='block'; success.textContent='⏳ Sauvegarde…';
  const ok = await sbInsert('action', action);

  if (ok) {
    DB.actions.push({
      'ID_Action': nextId, 'ID_Observation': selectedObs['ID_Observation'],
      'Num_Action': String(action.num_action), 'Description': action.description||'',
      'Quantite_realisee': String(action.quantite_realisee||''), 'Unite': action.unite||'',
      'Etat_estime': String(action.etat_estime||''), 'Date': action.date_action||'',
      'OK_NOK': action.ok_nok||'', 'WO': action.wo||'', 'Remarques': action.remarques||'',
      'encoded_par': action.encoded_par||'', 'photo_url': photoUrl||''
    });
    success.textContent = '✓ Action enregistrée avec succès !';
    setTimeout(() => goTo('actions'), 1500);
  } else {
    success.style.display='none';
    error.style.display='block'; error.textContent='❌ Erreur de sauvegarde. Réessayez.';
  }
}

        <span style="position:absolute;top:6px;left:6px;background:rgba(0,0,0,0.6);color:#fff;padding:3px 8px;border-radius:4px;font-size:11px">Photo actuelle</span>
      </div>`;
    document.getElementById('edit-btn-photo').textContent = '🔄 Remplacer la photo';
  } else {
    photoCurrent.innerHTML = '';
    document.getElementById('edit-btn-photo').textContent = '📷 Ajouter une photo';
  }
  document.getElementById('edit-photo-actions-row').style.display = 'none';

  goTo('edit-action');
}

function takeEditPhoto() { document.getElementById('edit-photo-input').click(); }
function retakeEditPhoto() { document.getElementById('edit-photo-input').click(); }

function handleEditPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 1200;
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        editPhotoBlob = blob;
        const sizeKB = Math.round(blob.size / 1024);
        const preview = document.createElement('img');
        preview.src = URL.createObjectURL(blob);
        preview.style.cssText = 'width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-bottom:8px';
        const photoCurrent = document.getElementById('edit-photo-current');
        photoCurrent.innerHTML = '<div style="font-size:11px;color:var(--green);margin-bottom:6px">✓ Nouvelle photo prête</div>';
        photoCurrent.appendChild(preview);
        document.getElementById('edit-photo-actions-row').style.display = 'flex';
        document.getElementById('edit-photo-size').textContent = `WebP · ${sizeKB} KB (${w}×${h})`;
        document.getElementById('edit-btn-photo').style.display = 'none';
      }, 'image/webp', 0.75);
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveEditAction() {
  const success = document.getElementById('edit-success');
  const error = document.getElementById('edit-error');
  success.style.display = 'none'; error.style.display = 'none';

  const a = DB.actions.find(x => x['ID_Action'] === currentEditActionId);
  if (!a) return;

  let photoUrl = a['photo_url'] || null;

  // Upload nouvelle photo si présente
  if (editPhotoBlob) {
    success.style.display = 'block'; success.textContent = '⏳ Upload de la photo…';
    const filename = `${selectedObs['ID_Observation']}_${currentEditActionId}_${Date.now()}.webp`;
    photoUrl = await uploadPhoto(editPhotoBlob, filename);
    if (!photoUrl) {
      error.style.display = 'block'; error.textContent = '⚠️ Erreur upload photo.';
    }
  }

  const data = {
    description: document.getElementById('edit-desc').value || null,
    date_action: document.getElementById('edit-date').value || null,
    wo: document.getElementById('edit-wo').value || null,
    quantite_realisee: parseFloat(document.getElementById('edit-qty').value) || null,
    unite: document.getElementById('edit-unit').value || null,
    etat_estime: parseInt(document.getElementById('edit-etat').value) || null,
    ok_nok: document.getElementById('edit-oknok').value || null,
    remarques: document.getElementById('edit-rem').value || null,
    encoded_par: currentUser ? (currentUser.nom || currentUser.username) : null,
    photo_url: photoUrl
  };

  success.style.display = 'block'; success.textContent = '⏳ Sauvegarde…';
  const ok = await sbUpdate('action', 'id_action', currentEditActionId, data);

  if (ok) {
    // Mettre à jour localement
    a['Description'] = data.description || '';
    a['Date'] = data.date_action || '';
    a['WO'] = data.wo || '';
    a['Quantite_realisee'] = String(data.quantite_realisee || '');
    a['Unite'] = data.unite || '';
    a['Etat_estime'] = String(data.etat_estime || '');
    a['OK_NOK'] = data.ok_nok || '';
    a['Remarques'] = data.remarques || '';
    a['encoded_par'] = data.encoded_par || '';
    a['photo_url'] = photoUrl || '';
    success.textContent = '✓ Action modifiée avec succès !';
    setTimeout(() => goTo('actions'), 1500);
  } else {
    success.style.display = 'none';
    error.style.display = 'block'; error.textContent = '❌ Erreur de sauvegarde.';
  }
}

// ===== LIGHTBOX =====
function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
</script>
