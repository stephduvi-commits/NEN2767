<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEN 2767 — Suivi patrimoine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #16161f;
    --border: #1e1e2a;
    --border2: #2a2a3a;
    --text: #e8e6f0;
    --muted: #6b6b85;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f97316;
    --yellow: #eab308;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* LAYOUT */
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-brand {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .topbar-brand span { color: var(--accent); }

  .topbar-stats {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
  }

  .main { display: flex; flex: 1; }

  /* SIDEBAR */
  .sidebar {
    width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: calc(100vh - 56px);
    position: sticky;
    top: 56px;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  .search {
    width: 100%;
    padding: 8px 12px 8px 32px;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    position: relative;
  }
  .search:focus { border-color: var(--accent); }
  .search-wrap { position: relative; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }

  .sidebar-list { overflow-y: auto; flex: 1; padding: 8px; }

  .bat-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s;
    border: 1px solid transparent;
  }
  .bat-item:hover { background: var(--bg); }
  .bat-item.active { background: #1e1e35; border-color: var(--accent); }

  .nen-dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    color: #fff;
    flex-shrink: 0;
  }

  .bat-info { flex: 1; min-width: 0; }
  .bat-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bat-meta { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* CONTENT */
  .content { flex: 1; overflow-y: auto; padding: 24px; }

  /* WELCOME */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }
  .welcome-icon { font-size: 48px; }
  .welcome h2 { font-size: 18px; font-weight: 600; color: var(--text); }
  .welcome p { font-size: 13px; }

  /* STATS ROW */
  .stats-row { display: flex; gap: 12px; margin-bottom: 20px; }
  .stat-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-value { font-size: 24px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

  /* SECTION */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .count { background: var(--border2); color: var(--muted); padding: 2px 8px; border-radius: 20px; font-size: 11px; }

  /* TABLE */
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }

  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 10px 14px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  tr.clickable { cursor: pointer; transition: background 0.15s; }
  tr.clickable:hover td { background: #1a1a28; }
  tr.selected td { background: #1e1e35; }

  /* BADGES */
  .badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }

  .ok-badge { background: #1a2e1a; color: var(--green); }
  .nok-badge { background: #2e1a1a; color: var(--red); }
  .pending-badge { background: var(--border); color: var(--muted); }

  /* DETAIL PANEL */
  .detail-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .detail-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .detail-title { font-size: 15px; font-weight: 600; }
  .detail-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .detail-body { padding: 0; }

  .detail-row {
    display: flex;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    gap: 16px;
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { font-size: 12px; color: var(--muted); width: 140px; flex-shrink: 0; padding-top: 1px; }
  .detail-value { font-size: 13px; flex: 1; }

  /* BACK BTN */
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    margin-bottom: 16px;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--text); }

  /* FORM */
  .form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .form-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  label { font-size: 12px; color: var(--muted); font-weight: 500; }

  input, select, textarea {
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 80px; }
  select option { background: var(--surface); }

  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4f46e5; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border2); }
  .btn-ghost:hover { color: var(--text); border-color: var(--border2); }

  .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .success-msg {
    padding: 10px 14px;
    background: #1a2e1a;
    border: 1px solid #2a4a2a;
    border-radius: 8px;
    color: var(--green);
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }

  /* NEN COLORS */
  .nen1 { background: #16a34a; }
  .nen2 { background: #65a30d; }
  .nen3 { background: #ca8a04; }
  .nen4 { background: #ea580c; }
  .nen5 { background: #dc2626; }
  .nen6 { background: #7f1d1d; }

  .prio1 { color: var(--red); }
  .prio2 { color: var(--orange); }
  .prio3 { color: var(--yellow); }
  .prio4 { color: var(--green); }

  .flag-action { background: #1a2e1a; color: var(--green); }
  .flag-noaction { background: var(--border); color: var(--muted); }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab {
    padding: 7px 16px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    transition: all 0.15s;
    border: 1px solid transparent;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: #1e1e35; color: var(--accent); border-color: var(--accent); }

  /* FILTER BAR */
  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .filter-select {
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    outline: none;
    cursor: pointer;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .stats-row { flex-wrap: wrap; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  </div>
</div>

// ===== HELPERS =====
function nenClass(n) {
  const m = {1:'nen1',2:'nen2',3:'nen3',4:'nen4',5:'nen5',6:'nen6'};
  return m[parseInt(n)] || 'nen4';
}

function nenLabel(n) {
  const m = {1:'Excellent',2:'Bon',3:'Acceptable',4:'Médiocre',5:'Mauvais',6:'Critique'};
  return m[parseInt(n)] || '—';
}

function prioClass(p) {
  return 'prio' + parseInt(p);
}

function okBadge(v) {
  if (!v) return '<span class="badge pending-badge">—</span>';
  if (v.toLowerCase() === 'ok') return '<span class="badge ok-badge">✓ OK</span>';
  if (v.toLowerCase() === 'nok') return '<span class="badge nok-badge">✗ NOK</span>';
  return '<span class="badge pending-badge">' + v + '</span>';
}

function getObs(batId) {
  return DB.observations.filter(o => o['ID_Batiment'] === batId);
}

function getActions(obsId) {
  return DB.actions.filter(a => a['ID_Observation'] === obsId);
}

// ===== INIT =====
let selectedBat = null;
let selectedObs = null;
let currentView = 'batiment'; // batiment | observation

document.getElementById('total-bat').textContent = DB.batiments.length + ' bâtiments';
document.getElementById('total-obs').textContent = DB.observations.length + ' observations';
document.getElementById('total-act').textContent = DB.actions.length + ' actions';

function filterBatiments() {
  const q = document.getElementById('search-bat').value.toLowerCase();
  renderSidebar(q);
}

function renderSidebar(filter = '') {
  const list = document.getElementById('bat-list');
  const items = DB.batiments.filter(b =>
    b['Nom'].toLowerCase().includes(filter) ||
    b['Lieu'].toLowerCase().includes(filter) ||
    b['ID_Batiment'].toLowerCase().includes(filter)
  );
  list.innerHTML = items.map(b => {
    const obs = getObs(b['ID_Batiment']);
    const actCount = obs.reduce((sum, o) => sum + getActions(o['ID_Observation']).length, 0);
    const active = selectedBat && selectedBat['ID_Batiment'] === b['ID_Batiment'] ? 'active' : '';
    return `
      <div class="bat-item ${active}" onclick="selectBat('${b['ID_Batiment']}')">
        <div class="nen-dot ${nenClass(b['État bâtiment'])}">${b['État bâtiment'] || '?'}</div>
        <div class="bat-info">
          <div class="bat-name">${b['Nom'] || b['ID_Batiment']}</div>
          <div class="bat-meta">${b['Lieu']} · ${obs.length} obs · ${actCount} actions</div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== VUE BÂTIMENT =====
function selectBat(id) {
  selectedBat = DB.batiments.find(b => b['ID_Batiment'] === id);
  selectedObs = null;
  currentView = 'batiment';
  renderSidebar(document.getElementById('search-bat').value.toLowerCase());
  renderBatiment();
}

function renderBatiment() {
  const b = selectedBat;
  const obs = getObs(b['ID_Batiment']);
  const actCount = obs.reduce((sum, o) => sum + getActions(o['ID_Observation']).length, 0);
  const obsWithAct = obs.filter(o => getActions(o['ID_Observation']).length > 0);

  // filter state
  let filterEtat = '';
  let filterPrio = '';

  function getFilteredObs() {
    return obs.filter(o => {
      if (filterEtat && o['État'] !== filterEtat) return false;
      if (filterPrio && o['Priorité'] !== filterPrio) return false;
      return true;
    });
  }

  function render() {
    const filtered = getFilteredObs();
    document.getElementById('content').innerHTML = `
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-value" style="color: var(--${['','green','green','yellow','orange','red','red'][parseInt(b['État bâtiment'])||4]})">${b['État bâtiment'] || '?'}</div>
          <div class="stat-label">Score NEN · ${nenLabel(b['État bâtiment'])}</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${obs.length}</div>
          <div class="stat-label">Observations</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color:var(--green)">${obsWithAct.length}</div>
          <div class="stat-label">Avec actions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${actCount}</div>
          <div class="stat-label">Actions totales</div>
        </div>
      </div>

      <div class="detail-panel">
        <div class="detail-header">
          <div class="nen-dot ${nenClass(b['État bâtiment'])}" style="width:40px;height:40px;font-size:16px">${b['État bâtiment']||'?'}</div>
          <div>
            <div class="detail-title">${b['Nom'] || b['ID_Batiment']}</div>
            <div class="detail-sub">${b['Lieu']} · ${b['Code objet']}</div>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-row"><span class="detail-label">ID</span><span class="detail-value">${b['ID_Batiment']}</span></div>
          <div class="detail-row"><span class="detail-label">Code objet</span><span class="detail-value">${b['Code objet']||'—'}</span></div>
          <div class="detail-row"><span class="detail-label">Lieu</span><span class="detail-value">${b['Lieu']||'—'}</span></div>
          <div class="detail-row"><span class="detail-label">État NEN</span><span class="detail-value">${b['État bâtiment']} — ${nenLabel(b['État bâtiment'])}</span></div>
        </div>
      </div>

      <div class="section-title">
        Observations
        <span class="count">${filtered.length}</span>
      </div>

      <div class="filter-bar">
        <select class="filter-select" id="f-etat" onchange="updateFilters()">
          <option value="">Tous les états</option>
          ${[1,2,3,4,5,6].map(i=>`<option value="${i}" ${filterEtat==i?'selected':''}>État ${i} — ${nenLabel(i)}</option>`).join('')}
        </select>
        <select class="filter-select" id="f-prio" onchange="updateFilters()">
          <option value="">Toutes priorités</option>
          ${[1,2,3,4].map(i=>`<option value="${i}" ${filterPrio==i?'selected':''}>Priorité ${i}</option>`).join('')}
        </select>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Élément</th>
              <th>Procédure</th>
              <th>NL/SfB</th>
              <th>État</th>
              <th>Priorité</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.length === 0 ? '<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:24px">Aucune observation</td></tr>' :
              filtered.map(o => {
                const acts = getActions(o['ID_Observation']);
                return `<tr class="clickable" onclick="selectObs('${o['ID_Observation']}')">
                  <td><span style="font-weight:500">${o['Élément']||'—'}</span></td>
                  <td style="color:var(--muted)">${o['Procédure']||'—'}</td>
                  <td style="color:var(--muted)">${o['NL/SfB']||'—'}</td>
                  <td><span class="badge ${nenClass(o['État'])}" style="color:#fff;background:var(--${['','green','green','yellow','orange','red','red'][parseInt(o['État'])||4]})">${o['État']}</span></td>
                  <td><span class="badge" style="font-weight:600" class="${prioClass(o['Priorité'])}">${o['Priorité']||'—'}</span></td>
                  <td>${acts.length > 0 ? `<span class="badge flag-action">🔧 ${acts.length}</span>` : '<span class="badge flag-noaction">⏳ 0</span>'}</td>
                </tr>`;
              }).join('')
            }
          </tbody>
        </table>
      </div>
    `;

    document.getElementById('f-etat').addEventListener('change', function() { filterEtat = this.value; render(); });
    document.getElementById('f-prio').addEventListener('change', function() { filterPrio = this.value; render(); });
  }

  window.updateFilters = function() {};
  render();
}

                <td>${a['Description'] || (a['Remarques'] ? a['Remarques'].substring(0,60)+'…' : '—')}</td>
                <td style="color:var(--muted)">${a['Date']||'—'}</td>
                <td style="color:var(--muted)">${a['WO']||'—'}</td>
                <td>${a['Etat_estime'] ? `<span class="badge ${nenClass(a['Etat_estime'])}" style="color:#fff">${a['Etat_estime']}</span>` : '—'}</td>
                <td>${okBadge(a['OK_NOK'])}</td>
              </tr>
            `).join('')
          }
        </tbody>
      </table>
    </div>

    <div class="form-card">
      <div class="form-title">➕ Ajouter une action</div>
      <div id="success-msg" class="success-msg">✓ Action ajoutée avec succès !</div>
      <div class="form-grid">
        <div class="form-group full">
          <label>Description</label>
          <textarea id="f-desc" placeholder="Description de l'action réalisée…"></textarea>
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="f-date" />
        </div>
        <div class="form-group">
          <label>Work Order (WO)</label>
          <input type="text" id="f-wo" placeholder="ex. WO-2025-001" />
        </div>
        <div class="form-group">
          <label>Quantité réalisée</label>
          <input type="number" id="f-qty" placeholder="0" />
        </div>
        <div class="form-group">
          <label>Unité</label>
          <input type="text" id="f-unit" placeholder="ex. pc, m², h" />
        </div>
        <div class="form-group">
          <label>État estimé après action</label>
          <select id="f-etat">
            <option value="">— Sélectionner —</option>
            ${[1,2,3,4,5,6].map(i=>`<option value="${i}">${i} — ${nenLabel(i)}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label>Statut</label>
          <select id="f-oknok">
            <option value="">— Sélectionner —</option>
            <option value="ok">✓ OK</option>
            <option value="nok">✗ NOK</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Remarques</label>
          <textarea id="f-rem" placeholder="Remarques supplémentaires…"></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="selectObs('${o['ID_Observation']}')">Annuler</button>
        <button class="btn btn-primary" onclick="addAction('${o['ID_Observation']}', '${nextId}')">Enregistrer l'action</button>
      </div>
    </div>
  `;
}

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7XuA_1QwXARjMxH9MVMUwyb_GpwKZW3yqmkrkC20f6ezPPB8wgaO9lHfYLrew9w-j7g/exec";

function addAction(obsId, actionId) {
  const action = {
    'ID_Action': actionId,
    'ID_Observation': obsId,
    'Num_Action': String(DB.actions.filter(a => a['ID_Observation'] === obsId).length + 1),
    'Description': document.getElementById('f-desc').value,
    'Quantite_realisee': document.getElementById('f-qty').value,
    'Unite': document.getElementById('f-unit').value,
    'Etat_estime': document.getElementById('f-etat').value,
    'Date': document.getElementById('f-date').value,
    'OK_NOK': document.getElementById('f-oknok').value,
    'WO': document.getElementById('f-wo').value,
    'Remarques': document.getElementById('f-rem').value,
  };

  DB.actions.push(action);

  const msg = document.getElementById('success-msg');
  msg.style.display = 'block';
  msg.textContent = '⏳ Sauvegarde en cours…';

  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(action)
  }).then(() => {
    msg.textContent = '✓ Action sauvegardée dans Google Sheets !';
    setTimeout(() => { selectObs(obsId); }, 1500);
  }).catch(() => {
    msg.textContent = '⚠️ Erreur de sauvegarde — données conservées localement.';
    msg.style.background = '#2e1a1a';
    msg.style.color = 'var(--red)';
    setTimeout(() => { selectObs(obsId); }, 2000);
  });
}

// ===== START =====
renderSidebar();
</script>
</body>
</html>
